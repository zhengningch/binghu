<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>著作文库 · 吴承学</title>
    <link rel="stylesheet" href="assets/css/style.css?v=20260905">
    <link rel="stylesheet" href="assets/css/library.css?v=20260905">
</head>
<body class="page-library">

    <div class="bg-paper" aria-hidden="true"></div>
    <div class="bg" id="bg" aria-hidden="true"></div>

    <!-- 主内容区：搜索框 + 书籍，全部用 HTML 组件 -->
    <div class="library-content">
        <!-- 搜索框 -->
        <div class="search-area" id="searchArea">
            <div class="search-label">关键词检索</div>
            <form class="search-form" id="searchForm" autocomplete="off">
                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="如：文体学、辨体、明小品……"
                    autocomplete="off"
                >
                <button class="search-btn" type="submit" aria-label="检索">↵</button>
                <button class="search-clear hidden" id="searchClear" type="button" aria-label="清空">×</button>
            </form>
            <div class="search-results hidden" id="searchResults"></div>
        </div>

        <!-- 书籍排列区 -->
        <div class="books-shelf" id="booksShelf"></div>
    </div>

    <!-- 退出按钮 -->
    <button class="logout-mini" id="logoutBtn" type="button" title="退出登录">退出</button>

    <!-- 全屏 EPUB 阅读器覆盖层 -->
    <div class="reader-overlay hidden" id="readerOverlay" aria-hidden="true">
        <header class="reader-header">
            <button class="back-btn" id="backBtn" type="button">← 返回文库</button>
            <div class="reader-title" id="readerTitle">书籍</div>
            <span class="reader-page-info hidden" id="readerPageInfo"></span>
            <div class="reader-actions">
                <button class="reader-btn" id="readerSearch" type="button" title="检索本书">搜</button>
                <button class="reader-btn" id="readerToc" type="button" title="目录">目</button>
                <button class="reader-btn" id="readerSettings" type="button" title="设置">⚙</button>
                <button class="reader-btn" id="readerPrev" type="button" title="上一页/上一章">‹</button>
                <button class="reader-btn" id="readerNext" type="button" title="下一页/下一章">›</button>
            </div>
        </header>
        <div class="reader-container" id="readerContainer">
            <div class="reader-placeholder">
                <p class="placeholder-text">正在加载书籍内容…</p>
            </div>
        </div>
        <div class="pdf-hitbar hidden" id="pdfHitBar" role="status"></div>
        <div class="reader-progress">
            <div class="reader-progress-bar" id="readerProgressBar"></div>
        </div>
        <nav class="reader-toc hidden" id="readerTocPanel">
            <h3 class="toc-title">目录</h3>
            <div class="page-jump hidden" id="pageJump">
                <input type="number" id="pageJumpInput" min="1" placeholder="页码" aria-label="跳转页码">
                <button type="button" class="page-jump-btn" id="pageJumpBtn">跳页</button>
                <span class="page-jump-total" id="pageJumpTotal"></span>
            </div>
            <ol class="toc-list" id="tocList"></ol>
        </nav>

        <!-- 书内检索面板 -->
        <div class="reader-search hidden" id="readerSearchPanel" role="search">
            <h3 class="toc-title">检索本书</h3>
            <input type="text" id="bookSearchInput" class="book-search-input"
                placeholder="输入关键词，检索本书全部内容" autocomplete="off">
            <div class="book-search-status hidden" id="bookSearchStatus"></div>
            <ol class="book-search-list" id="bookSearchList"></ol>
        </div>

        <!-- 阅读设置面板 -->
        <div class="modal hidden" id="settingsModal">
            <div class="modal-mask" id="settingsMask"></div>
            <div class="modal-body settings-body">
                <h3 class="modal-title">阅读设置</h3>
                <div class="settings-row">
                    <label class="settings-label">字号</label>
                    <div class="settings-options">
                        <label class="settings-option">
                            <input type="radio" name="fontSize" value="90">
                            <span>小</span>
                        </label>
                        <label class="settings-option">
                            <input type="radio" name="fontSize" value="100">
                            <span>标准</span>
                        </label>
                        <label class="settings-option">
                            <input type="radio" name="fontSize" value="110">
                            <span>大</span>
                        </label>
                        <label class="settings-option">
                            <input type="radio" name="fontSize" value="125">
                            <span>特大</span>
                        </label>
                    </div>
                </div>
                <div class="settings-hint">左右键翻章，上下键章节内滚动。</div>
                <button class="btn btn-primary modal-ok" id="settingsOk" type="button">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast hidden" id="toast"></div>

    <!-- Modal -->
    <div class="modal hidden" id="modal" role="dialog" aria-modal="true">
        <div class="modal-mask" data-modal-close></div>
        <div class="modal-body">
            <h3 class="modal-title" id="modalTitle">提示</h3>
            <p class="modal-content" id="modalContent"></p>
            <button class="btn btn-primary modal-ok" id="modalOk" type="button">知道了</button>
        </div>
    </div>

    <!-- epub.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>

    <script src="assets/js/books.js?v=20260905"></script>
    <script src="assets/js/library.js?v=20260906"></script>
</body>
</html>
