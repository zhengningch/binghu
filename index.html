<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吴承学著作文库</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="page-login">
    <!-- 第一层：纸纹底色（contain 留白时透出） -->
    <div class="bg-paper" aria-hidden="true"></div>

    <!-- 第二层：login.jpg contain 居中显示 -->
    <div class="bg" id="bg" aria-hidden="true"></div>

    <!-- 登录输入框（直接显示在图上"登录"位置，和检索框一致） -->
    <div class="login-overlay" id="loginOverlay">
        <form class="login-form" id="loginForm" autocomplete="off">
            <input
                type="text"
                id="inviteCode"
                name="invite"
                class="login-input"
                placeholder="请输入邀请码"
                maxlength="32"
                aria-label="邀请码"
                required
            >
            <button type="submit" class="login-btn" aria-label="进入文库">↵</button>
        </form>
        <p class="login-error" id="loginError" role="alert"></p>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
