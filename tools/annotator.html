<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书热区标注工具 · 吴承学著作文库</title>
    <style>
        :root {
            --paper: #f3ebd9;
            --paper-deep: #e8dcc1;
            --paper-light: #f8f2e3;
            --ink: #2b2723;
            --ink-soft: #5b524a;
            --ink-faint: #8a8278;
            --vermilion: #b8392f;
            --vermilion-deep: #8e2419;
            --jade: #4a7466;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
            color: var(--ink);
            background: #1a1a1a;
            overflow: hidden;
        }

        .topbar {
            height: 56px;
            background: var(--paper);
            border-bottom: 1px solid var(--paper-deep);
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 12px;
        }

        .topbar h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--ink);
            letter-spacing: 0.05em;
        }

        .topbar .subtitle {
            font-size: 12px;
            color: var(--ink-faint);
            margin-left: 8px;
        }

        .topbar .spacer { flex: 1; }

        .btn {
            padding: 6px 14px;
            background: transparent;
            border: 1px solid var(--ink-soft);
            color: var(--ink);
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
            border-radius: 2px;
            letter-spacing: 0.05em;
            transition: all .15s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: var(--ink); color: var(--paper-light); }
        .btn-primary { background: var(--vermilion); color: var(--paper-light); border-color: var(--vermilion-deep); }
        .btn-primary:hover { background: var(--vermilion-deep); }
        .btn-danger { border-color: var(--vermilion); color: var(--vermilion); }
        .btn-danger:hover { background: var(--vermilion); color: var(--paper-light); }
        .btn-small { padding: 3px 8px; font-size: 12px; }

        .select {
            padding: 6px 10px;
            background: var(--paper-light);
            border: 1px solid var(--ink-soft);
            color: var(--ink);
            font-family: inherit;
            font-size: 13px;
            border-radius: 2px;
            cursor: pointer;
        }

        .main {
            display: flex;
            height: calc(100% - 56px);
        }

        .canvas-area {
            flex: 1;
            position: relative;
            overflow: auto;
            background: #2a2a2a;
            background-image:
                linear-gradient(45deg, #222 25%, transparent 25%),
                linear-gradient(-45deg, #222 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #222 75%),
                linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        .canvas-wrap {
            position: relative;
            display: inline-block;
            transform-origin: 0 0;
        }

        .canvas-wrap img {
            display: block;
            user-select: none;
            -webkit-user-drag: none;
        }

        .grid-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(184,57,47,0.25) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(184,57,47,0.25) 1px, transparent 1px);
            background-size: 200px 200px;
            display: none;
        }
        .grid-overlay.show { display: block; }

        .rect {
            position: absolute;
            border: 2px solid var(--vermilion);
            background: rgba(184, 57, 47, 0.08);
            cursor: move;
            box-sizing: border-box;
        }
        .rect.selected {
            border-color: var(--jade);
            background: rgba(74, 116, 102, 0.18);
            border-width: 3px;
            z-index: 10;
        }
        .rect.coming-soon {
            border-color: var(--ink-faint);
            border-style: dashed;
            background: rgba(43, 39, 35, 0.04);
        }
        .rect.coming-soon.selected {
            border-color: var(--jade);
            background: rgba(74, 116, 102, 0.15);
        }

        .rect-label {
            position: absolute;
            top: -26px;
            left: 0;
            padding: 2px 8px;
            background: var(--vermilion);
            color: var(--paper-light);
            font-size: 12px;
            font-family: inherit;
            white-space: nowrap;
            border-radius: 2px;
            pointer-events: none;
        }
        .rect.coming-soon .rect-label {
            background: var(--ink-soft);
        }

        .handle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--paper-light);
            border: 2px solid var(--vermilion);
            border-radius: 50%;
        }
        .rect.selected .handle { background: var(--jade); border-color: var(--jade); }
        .handle-nw { top: -5px; left: -5px; cursor: nwse-resize; }
        .handle-ne { top: -5px; right: -5px; cursor: nesw-resize; }
        .handle-sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
        .handle-se { bottom: -5px; right: -5px; cursor: nwse-resize; }
        .handle-n { top: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
        .handle-s { bottom: -5px; left: 50%; margin-left: -5px; cursor: ns-resize; }
        .handle-w { left: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }
        .handle-e { right: -5px; top: 50%; margin-top: -5px; cursor: ew-resize; }

        .drawing-rect {
            position: absolute;
            border: 2px dashed var(--vermilion);
            background: rgba(184, 57, 47, 0.12);
            pointer-events: none;
            z-index: 100;
        }

        .sidebar {
            width: 360px;
            background: var(--paper);
            border-left: 1px solid var(--paper-deep);
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--paper-deep);
        }
        .sidebar-header h2 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .sidebar-header .hint {
            font-size: 12px;
            color: var(--ink-faint);
            line-height: 1.6;
        }

        .list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px;
        }

        .list-item {
            padding: 10px 12px;
            margin: 6px 0;
            background: var(--paper-light);
            border: 1px solid var(--paper-deep);
            border-radius: 2px;
            cursor: pointer;
            transition: all .15s;
        }
        .list-item:hover { border-color: var(--ink-soft); }
        .list-item.selected {
            border-color: var(--jade);
            background: rgba(74, 116, 102, 0.1);
        }

        .list-item .item-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 4px;
        }
        .list-item.coming-soon .item-title { color: var(--ink-soft); }
        .list-item .item-coord {
            font-family: "SF Mono", Monaco, monospace;
            font-size: 11px;
            color: var(--ink-faint);
        }
        .list-item .item-actions {
            margin-top: 6px;
            display: flex;
            gap: 4px;
        }

        .empty-list {
            padding: 40px 20px;
            text-align: center;
            color: var(--ink-faint);
            font-size: 13px;
            line-height: 1.8;
        }

        .editor {
            border-top: 1px solid var(--paper-deep);
            padding: 16px 20px;
            background: var(--paper-light);
            display: none;
        }
        .editor.show { display: block; }
        .editor h3 {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--ink);
        }
        .field {
            margin-bottom: 10px;
        }
        .field label {
            display: block;
            font-size: 12px;
            color: var(--ink-soft);
            margin-bottom: 4px;
        }
        .field input[type="text"] {
            width: 100%;
            padding: 6px 10px;
            border: 1px solid var(--paper-deep);
            background: var(--paper);
            color: var(--ink);
            font-family: inherit;
            font-size: 13px;
            border-radius: 2px;
            outline: none;
        }
        .field input[type="text"]:focus {
            border-color: var(--vermilion);
            box-shadow: 0 0 0 2px rgba(184, 57, 47, 0.1);
        }
        .field-row {
            display: flex;
            gap: 8px;
        }
        .field-row > * { flex: 1; }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--ink-soft);
            cursor: pointer;
        }

        .toast {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: rgba(43, 39, 35, 0.92);
            color: var(--paper-light);
            padding: 10px 20px;
            border-radius: 2px;
            font-size: 14px;
            z-index: 200;
            opacity: 0;
            transition: all .3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .statusbar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 360px;
            background: rgba(43, 39, 35, 0.92);
            color: var(--paper-light);
            padding: 6px 16px;
            font-family: "SF Mono", Monaco, monospace;
            font-size: 12px;
            display: flex;
            gap: 24px;
            pointer-events: none;
        }
        .statusbar .item { display: flex; gap: 6px; }
        .statusbar .label { color: var(--ink-faint); }

        .zoom-controls {
            position: fixed;
            right: 380px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            z-index: 50;
        }
        .zoom-btn {
            width: 36px;
            height: 36px;
            background: var(--paper);
            border: 1px solid var(--paper-deep);
            color: var(--ink);
            cursor: pointer;
            font-size: 18px;
            border-radius: 2px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }
        .zoom-btn:hover { background: var(--ink); color: var(--paper-light); }

        .help-banner {
            background: rgba(184, 57, 47, 0.08);
            border: 1px solid rgba(184, 57, 47, 0.3);
            color: var(--vermilion-deep);
            padding: 8px 12px;
            font-size: 12px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <h1>图书热区标注工具</h1>
        <span class="subtitle">在图上拖拽矩形框选每本书</span>
        <div class="spacer"></div>

        <select id="imgSelect" class="select">
            <option value="../assets/img/library.jpg">library.jpg · 检索页</option>
            <option value="../assets/img/home.jpg">home.jpg · 默认首页</option>
            <option value="../assets/img/login.jpg">login.jpg · 登录页</option>
            <option value="../assets/img/books8.jpg">books8.jpg · 8 本书合集</option>
        </select>

        <label style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);cursor:pointer">
            <input type="checkbox" id="showGrid"> 显示网格
        </label>

        <button class="btn" id="loadBtn">加载已有配置</button>
        <button class="btn btn-danger" id="clearBtn">清空全部</button>
        <button class="btn" id="copyBtn">复制 JSON</button>
        <button class="btn btn-primary" id="downloadBtn">导出 JSON</button>

        <a class="btn" href="../library.html">回到文库 ↗</a>
    </div>

    <div class="main">
        <div class="canvas-area" id="canvasArea">
            <div class="canvas-wrap" id="canvasWrap">
                <img id="imgEl" src="../assets/img/library.jpg" alt="待标注图片">
                <div class="grid-overlay" id="gridOverlay"></div>
            </div>
            <div class="drawing-rect" id="drawingRect" style="display:none"></div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <h2>标注列表</h2>
                <p class="hint">
                    在左侧图片上<strong>按住鼠标拖拽</strong>框出一本书。<br>
                    点击已有矩形可在右侧编辑书名。
                </p>
                <div class="help-banner" style="margin-top:10px">
                    <strong>标注完成后</strong>：<br>
                    ① 点击「导出 JSON」下载<br>
                    ② 把下载的文件放到<br>
                    <code>site/assets/data/library-hotspots.json</code>
                </div>
            </div>
            <div class="list" id="list">
                <div class="empty-list">
                    还没有任何标注<br>
                    在左侧图片上拖拽开始
                </div>
            </div>
            <div class="editor" id="editor">
                <h3>编辑标注 <span id="editIdx" style="color:var(--ink-faint);font-weight:normal"></span></h3>
                <div class="field">
                    <label>书名</label>
                    <input type="text" id="editTitle" placeholder="如：中国古代文体学研究">
                </div>
                <div class="field">
                    <label>书籍 ID（与 books.js 对应）</label>
                    <input type="text" id="editId" placeholder="如：wenti-xue-yanjiu">
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>x</label>
                        <input type="text" id="editX">
                    </div>
                    <div class="field">
                        <label>y</label>
                        <input type="text" id="editY">
                    </div>
                </div>
                <div class="field-row">
                    <div class="field">
                        <label>w</label>
                        <input type="text" id="editW">
                    </div>
                    <div class="field">
                        <label>h</label>
                        <input type="text" id="editH">
                    </div>
                </div>
                <label class="checkbox-row">
                    <input type="checkbox" id="editAvailable"> 已上线可读（available）
                </label>
                <div style="margin-top:12px;display:flex;gap:8px">
                    <button class="btn btn-danger btn-small" id="deleteBtn">删除</button>
                    <div style="flex:1"></div>
                    <button class="btn btn-small" id="closeEditor">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <div class="zoom-controls">
        <button class="zoom-btn" id="zoomInBtn" title="放大">+</button>
        <button class="zoom-btn" id="zoomOutBtn" title="缩小">−</button>
        <button class="zoom-btn" id="zoomFitBtn" title="适应窗口" style="font-size:14px">⤢</button>
    </div>

    <div class="statusbar">
        <div class="item"><span class="label">图片原始尺寸:</span><span id="statNatural">-</span></div>
        <div class="item"><span class="label">当前缩放:</span><span id="statScale">-</span></div>
        <div class="item"><span class="label">标注数:</span><span id="statCount">0</span></div>
        <div class="item"><span class="label">鼠标坐标:</span><span id="statCursor">-</span></div>
    </div>

    <script>
    (function () {
        'use strict';

        const $ = function (s) { return document.querySelector(s); };
        const canvasArea = $('#canvasArea');
        const canvasWrap = $('#canvasWrap');
        const imgEl = $('#imgEl');
        const gridOverlay = $('#gridOverlay');
        const drawingRect = $('#drawingRect');
        const listEl = $('#list');
        const editor = $('#editor');
        const toastEl = $('#toast');
        const imgSelect = $('#imgSelect');

        const state = {
            naturalW: 0,
            naturalH: 0,
            scale: 1,
            zoom: 1,
            rectangles: [],
            selectedIdx: -1,
            drag: null,
        };

        function escapeHtml(str) {
            return String(str || '').replace(/[&<>"']/g, function (c) {
                return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
            });
        }

        imgEl.addEventListener('load', function () {
            state.naturalW = imgEl.naturalWidth;
            state.naturalH = imgEl.naturalHeight;
            state.rectangles = [];
            state.selectedIdx = -1;
            fitToWindow();
            renderList();
            updateStatus();
        });

        imgSelect.addEventListener('change', function () {
            imgEl.src = imgSelect.value;
        });

        function fitToWindow() {
            const padding = 20;
            const aw = canvasArea.clientWidth - padding;
            const ah = canvasArea.clientHeight - padding;
            const fit = Math.min(aw / state.naturalW, ah / state.naturalH);
            state.scale = fit;
            state.zoom = 1;
            applyTransform();
        }

        function applyTransform() {
            const finalScale = state.scale * state.zoom;
            canvasWrap.style.width = (state.naturalW * finalScale) + 'px';
            canvasWrap.style.height = (state.naturalH * finalScale) + 'px';
            imgEl.style.width = (state.naturalW * finalScale) + 'px';
            imgEl.style.height = (state.naturalH * finalScale) + 'px';
            gridOverlay.style.width = (state.naturalW * finalScale) + 'px';
            gridOverlay.style.height = (state.naturalH * finalScale) + 'px';
            gridOverlay.style.backgroundSize = (200 * finalScale) + 'px ' + (200 * finalScale) + 'px';
            renderAllRects();
            updateStatus();
        }

        $('#zoomInBtn').addEventListener('click', function () { state.zoom *= 1.2; applyTransform(); });
        $('#zoomOutBtn').addEventListener('click', function () { state.zoom /= 1.2; applyTransform(); });
        $('#zoomFitBtn').addEventListener('click', fitToWindow);

        $('#showGrid').addEventListener('change', function (e) {
            gridOverlay.classList.toggle('show', e.target.checked);
        });

        canvasArea.addEventListener('wheel', function (e) {
            if (!e.ctrlKey && !e.metaKey) return;
            e.preventDefault();
            const delta = -Math.sign(e.deltaY) * 0.1;
            state.zoom = Math.max(0.1, Math.min(8, state.zoom * (1 + delta)));
            applyTransform();
        }, { passive: false });

        function clientToImage(clientX, clientY) {
            const rect = canvasWrap.getBoundingClientRect();
            const x = (clientX - rect.left) / state.scale / state.zoom;
            const y = (clientY - rect.top) / state.scale / state.zoom;
            return { x: Math.round(x), y: Math.round(y) };
        }

        canvasArea.addEventListener('mousedown', function (e) {
            if (e.target !== imgEl && e.target !== gridOverlay) return;

            const start = clientToImage(e.clientX, e.clientY);
            state.drag = {
                type: 'draw',
                startX: start.x,
                startY: start.y,
                curX: start.x,
                curY: start.y,
            };

            const areaRect = canvasArea.getBoundingClientRect();
            drawingRect.style.left = (e.clientX - areaRect.left + canvasArea.scrollLeft) + 'px';
            drawingRect.style.top = (e.clientY - areaRect.top + canvasArea.scrollTop) + 'px';
            drawingRect.style.width = '0px';
            drawingRect.style.height = '0px';
            drawingRect.style.display = 'block';
            e.preventDefault();
        });

        document.addEventListener('mousemove', function (e) {
            if (state.naturalW > 0) {
                const p = clientToImage(e.clientX, e.clientY);
                $('#statCursor').textContent = p.x + ', ' + p.y;
            }

            if (!state.drag) return;

            if (state.drag.type === 'draw') {
                const cur = clientToImage(e.clientX, e.clientY);
                state.drag.curX = Math.max(0, Math.min(state.naturalW, cur.x));
                state.drag.curY = Math.max(0, Math.min(state.naturalH, cur.y));
                updateDrawingRect();
            } else if (state.drag.type === 'move') {
                const dx = (e.clientX - state.drag.lastMouseX) / state.scale / state.zoom;
                const dy = (e.clientY - state.drag.lastMouseY) / state.scale / state.zoom;
                const r = state.rectangles[state.drag.idx];
                r.x = Math.round(Math.max(0, Math.min(state.naturalW - r.w, state.drag.origX + dx)));
                r.y = Math.round(Math.max(0, Math.min(state.naturalH - r.h, state.drag.origY + dy)));
                state.drag.lastMouseX = e.clientX;
                state.drag.lastMouseY = e.clientY;
                updateRectEl(state.drag.idx);
            } else if (state.drag.type.startsWith('resize')) {
                const dx = (e.clientX - state.drag.lastMouseX) / state.scale / state.zoom;
                const dy = (e.clientY - state.drag.lastMouseY) / state.scale / state.zoom;
                const r = state.rectangles[state.drag.idx];
                let nx = state.drag.orig.x;
                let ny = state.drag.orig.y;
                let nw = state.drag.orig.w;
                let nh = state.drag.orig.h;
                const dir = state.drag.type.replace('resize-', '');
                if (dir.indexOf('e') >= 0) nw = Math.max(20, nw + dx);
                if (dir.indexOf('s') >= 0) nh = Math.max(20, nh + dy);
                if (dir.indexOf('w') >= 0) { nx += dx; nw -= dx; if (nw < 20) { nx -= 20 - nw; nw = 20; } }
                if (dir.indexOf('n') >= 0) { ny += dy; nh -= dy; if (nh < 20) { ny -= 20 - nh; nh = 20; } }
                r.x = Math.round(Math.max(0, nx));
                r.y = Math.round(Math.max(0, ny));
                r.w = Math.round(Math.max(20, Math.min(state.naturalW - r.x, nw)));
                r.h = Math.round(Math.max(20, Math.min(state.naturalH - r.y, nh)));
                state.drag.lastMouseX = e.clientX;
                state.drag.lastMouseY = e.clientY;
                updateRectEl(state.drag.idx);
            }
        });

        function updateDrawingRect() {
            const d = state.drag;
            const x = Math.min(d.startX, d.curX);
            const y = Math.min(d.startY, d.curY);
            const w = Math.abs(d.curX - d.startX);
            const h = Math.abs(d.curY - d.startY);
            const finalScale = state.scale * state.zoom;
            const wrapRect = canvasWrap.getBoundingClientRect();
            const areaRect = canvasArea.getBoundingClientRect();
            drawingRect.style.left = (wrapRect.left - areaRect.left + canvasArea.scrollLeft + x * finalScale) + 'px';
            drawingRect.style.top = (wrapRect.top - areaRect.top + canvasArea.scrollTop + y * finalScale) + 'px';
            drawingRect.style.width = (w * finalScale) + 'px';
            drawingRect.style.height = (h * finalScale) + 'px';
        }

        document.addEventListener('mouseup', function () {
            if (!state.drag) return;
            if (state.drag.type === 'draw') {
                drawingRect.style.display = 'none';
                const d = state.drag;
                const x = Math.round(Math.min(d.startX, d.curX));
                const y = Math.round(Math.min(d.startY, d.curY));
                const w = Math.round(Math.abs(d.curX - d.startX));
                const h = Math.round(Math.abs(d.curY - d.startY));
                if (w >= 30 && h >= 30) {
                    const idx = state.rectangles.length;
                    state.rectangles.push({
                        id: 'book-' + (idx + 1),
                        title: '未命名 #' + (idx + 1),
                        x: x, y: y, w: w, h: h,
                        available: false,
                    });
                    state.selectedIdx = idx;
                    renderAllRects();
                    renderList();
                    showEditor();
                }
            }
            state.drag = null;
            updateStatus();
        });

        function renderAllRects() {
            canvasWrap.querySelectorAll('.rect').forEach(function (el) { el.remove(); });
            const finalScale = state.scale * state.zoom;
            state.rectangles.forEach(function (r, idx) {
                const el = document.createElement('div');
                el.className = 'rect' + (r.available ? '' : ' coming-soon') + (idx === state.selectedIdx ? ' selected' : '');
                el.style.left = (r.x * finalScale) + 'px';
                el.style.top = (r.y * finalScale) + 'px';
                el.style.width = (r.w * finalScale) + 'px';
                el.style.height = (r.h * finalScale) + 'px';
                el.dataset.idx = idx;

                const label = document.createElement('div');
                label.className = 'rect-label';
                label.textContent = r.title + (r.available ? '' : '（敬请期待）');
                el.appendChild(label);

                ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w'].forEach(function (dir) {
                    const h = document.createElement('div');
                    h.className = 'handle handle-' + dir;
                    h.dataset.handle = dir;
                    el.appendChild(h);
                });

                el.addEventListener('mousedown', function (ev) { onRectMouseDown(ev, idx); });
                canvasWrap.appendChild(el);
            });
        }

        function updateRectEl(idx) {
            const el = canvasWrap.querySelector('.rect[data-idx="' + idx + '"]');
            if (!el) return;
            const r = state.rectangles[idx];
            const finalScale = state.scale * state.zoom;
            el.style.left = (r.x * finalScale) + 'px';
            el.style.top = (r.y * finalScale) + 'px';
            el.style.width = (r.w * finalScale) + 'px';
            el.style.height = (r.h * finalScale) + 'px';
            renderListItem(idx);
            if (idx === state.selectedIdx) syncEditorFromRect(idx);
        }

        function onRectMouseDown(e, idx) {
            e.stopPropagation();
            e.preventDefault();
            state.selectedIdx = idx;
            renderAllRects();
            renderList();
            showEditor();

            const handle = e.target.dataset.handle;
            if (handle) {
                state.drag = {
                    type: 'resize-' + handle,
                    idx: idx,
                    lastMouseX: e.clientX,
                    lastMouseY: e.clientY,
                    orig: Object.assign({}, state.rectangles[idx]),
                };
            } else {
                state.drag = {
                    type: 'move',
                    idx: idx,
                    lastMouseX: e.clientX,
                    lastMouseY: e.clientY,
                    origX: state.rectangles[idx].x,
                    origY: state.rectangles[idx].y,
                };
            }
        }

        function renderList() {
            if (state.rectangles.length === 0) {
                listEl.innerHTML = '<div class="empty-list">还没有任何标注<br>在左侧图片上拖拽开始</div>';
                return;
            }
            listEl.innerHTML = '';
            state.rectangles.forEach(function (r, idx) {
                const li = document.createElement('div');
                li.className = 'list-item' + (r.available ? '' : ' coming-soon') + (idx === state.selectedIdx ? ' selected' : '');
                li.dataset.idx = idx;
                li.innerHTML =
                    '<div class="item-title">' + escapeHtml(r.title) + '</div>' +
                    '<div class="item-coord">x:' + r.x + '  y:' + r.y + '  w:' + r.w + '  h:' + r.h + '</div>' +
                    '<div class="item-actions">' +
                        '<button class="btn btn-small" data-act="focus">定位</button>' +
                        '<button class="btn btn-small btn-danger" data-act="del">删除</button>' +
                    '</div>';
                li.addEventListener('click', function (ev) {
                    if (ev.target.dataset.act) return;
                    state.selectedIdx = idx;
                    renderAllRects();
                    renderList();
                    showEditor();
                });
                li.querySelector('[data-act="focus"]').addEventListener('click', function () { focusRect(idx); });
                li.querySelector('[data-act="del"]').addEventListener('click', function () { deleteRect(idx); });
                listEl.appendChild(li);
            });
        }

        function renderListItem(idx) {
            const li = listEl.querySelector('.list-item[data-idx="' + idx + '"]');
            if (!li) return;
            const r = state.rectangles[idx];
            li.querySelector('.item-coord').textContent = 'x:' + r.x + '  y:' + r.y + '  w:' + r.w + '  h:' + r.h;
        }

        function focusRect(idx) {
            const r = state.rectangles[idx];
            if (!r) return;
            const finalScale = state.scale * state.zoom;
            const cx = (r.x + r.w / 2) * finalScale;
            const cy = (r.y + r.h / 2) * finalScale;
            canvasArea.scrollLeft = cx - canvasArea.clientWidth / 2;
            canvasArea.scrollTop = cy - canvasArea.clientHeight / 2;
        }

        function deleteRect(idx) {
            state.rectangles.splice(idx, 1);
            if (state.selectedIdx >= state.rectangles.length) state.selectedIdx = -1;
            renderAllRects();
            renderList();
            if (state.selectedIdx === -1) hideEditor();
            updateStatus();
        }

        function showEditor() {
            if (state.selectedIdx < 0) { hideEditor(); return; }
            editor.classList.add('show');
            syncEditorFromRect(state.selectedIdx);
        }
        function hideEditor() { editor.classList.remove('show'); }
        function syncEditorFromRect(idx) {
            const r = state.rectangles[idx];
            $('#editIdx').textContent = '#' + (idx + 1);
            $('#editTitle').value = r.title;
            $('#editId').value = r.id;
            $('#editX').value = r.x;
            $('#editY').value = r.y;
            $('#editW').value = r.w;
            $('#editH').value = r.h;
            $('#editAvailable').checked = !!r.available;
        }
        function syncRectFromEditor() {
            const idx = state.selectedIdx;
            if (idx < 0) return;
            const r = state.rectangles[idx];
            r.title = $('#editTitle').value.trim() || '未命名';
            r.id = $('#editId').value.trim() || ('book-' + (idx + 1));
            r.x = parseInt($('#editX').value) || 0;
            r.y = parseInt($('#editY').value) || 0;
            r.w = parseInt($('#editW').value) || 100;
            r.h = parseInt($('#editH').value) || 100;
            r.available = $('#editAvailable').checked;
            renderAllRects();
            renderList();
        }

        $('#editTitle').addEventListener('input', syncRectFromEditor);
        $('#editId').addEventListener('input', syncRectFromEditor);
        $('#editX').addEventListener('change', syncRectFromEditor);
        $('#editY').addEventListener('change', syncRectFromEditor);
        $('#editW').addEventListener('change', syncRectFromEditor);
        $('#editH').addEventListener('change', syncRectFromEditor);
        $('#editAvailable').addEventListener('change', syncRectFromEditor);

        $('#closeEditor').addEventListener('click', function () {
            state.selectedIdx = -1;
            renderAllRects();
            renderList();
            hideEditor();
        });

        $('#deleteBtn').addEventListener('click', function () {
            if (state.selectedIdx >= 0) deleteRect(state.selectedIdx);
        });

        $('#clearBtn').addEventListener('click', function () {
            if (state.rectangles.length === 0) return;
            if (!confirm('清空所有标注？')) return;
            state.rectangles = [];
            state.selectedIdx = -1;
            renderAllRects();
            renderList();
            hideEditor();
            updateStatus();
        });

        $('#loadBtn').addEventListener('click', async function () {
            try {
                const resp = await fetch('../assets/data/library-hotspots.json');
                if (!resp.ok) throw new Error('未找到');
                const data = await resp.json();
                state.rectangles = (data.hotspots || []).map(function (h) {
                    return {
                        id: h.id || '',
                        title: h.title || '未命名',
                        x: h.x, y: h.y, w: h.w, h: h.h,
                        available: !!h.available,
                    };
                });
                state.selectedIdx = -1;
                renderAllRects();
                renderList();
                hideEditor();
                updateStatus();
                showToast('已加载 ' + state.rectangles.length + ' 个标注');
            } catch (err) {
                showToast('加载失败：' + err.message);
            }
        });

        function buildJson() {
            return {
                _comment: '吴承学著作文库 - 图书热区配置',
                _image: imgSelect.value,
                _imageNaturalSize: { width: state.naturalW, height: state.naturalH },
                _note: '坐标使用图片原始像素 (' + state.naturalW + 'x' + state.naturalH + ')。前端通过自然尺寸与显示尺寸的比例自动适配任意屏幕。',
                hotspots: state.rectangles.map(function (r) {
                    return {
                        id: r.id,
                        title: r.title,
                        x: r.x, y: r.y, w: r.w, h: r.h,
                        available: r.available,
                    };
                }),
            };
        }

        $('#downloadBtn').addEventListener('click', function () {
            const json = JSON.stringify(buildJson(), null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'library-hotspots.json';
            document.body.appendChild(a);
            a.click();
            setTimeout(function () {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 100);
            showToast('已下载 library-hotspots.json，请放到 site/assets/data/ 下覆盖原文件');
        });

        $('#copyBtn').addEventListener('click', async function () {
            const json = JSON.stringify(buildJson(), null, 2);
            try {
                await navigator.clipboard.writeText(json);
                showToast('JSON 已复制到剪贴板');
            } catch (err) {
                const ta = document.createElement('textarea');
                ta.value = json;
                document.body.appendChild(ta);
                ta.select();
                try { document.execCommand('copy'); showToast('JSON 已复制'); }
                catch (e) { showToast('复制失败，请手动导出'); }
                document.body.removeChild(ta);
            }
        });

        let toastTimer = null;
        function showToast(text) {
            toastEl.textContent = text;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2400);
        }

        function updateStatus() {
            $('#statNatural').textContent = state.naturalW + ' × ' + state.naturalH;
            $('#statScale').textContent = (state.scale * state.zoom * 100).toFixed(1) + '%';
            $('#statCount').textContent = state.rectangles.length;
        }

        window.addEventListener('resize', function () {
            if (state.naturalW > 0) fitToWindow();
        });
    })();
    </script>
</body>
</html>
